<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="org.deepin.dde.Lastore1"/>
    <allow send_destination="org.deepin.dde.Lastore1"/>
    <allow receive_sender="org.deepin.dde.Lastore1"/>
    <allow send_interface="org.deepin.dde.Lastore1.Agent"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.deepin.dde.Lastore1"/>
    <allow receive_sender="org.deepin.dde.Lastore1"/>
    <deny send_destination="org.deepin.dde.Lastore1"
          send_interface="org.deepin.dde.Lastore1.Manager"
          send_member="SetAllowCaller"/>
    <deny send_destination="org.deepin.dde.Lastore1"
          send_interface="org.deepin.dde.Lastore1.Manager"
          send_member="PowerOff"/>
  </policy>
  <policy group="deepin-daemon">
    <allow send_destination="org.deepin.dde.Lastore1"/>
    <allow receive_sender="org.deepin.dde.Lastore1"/>
    <!-- SetAllowCaller 将调用者加入信任名单使其绕过 polkit，仅 root 可调用。
         拥有 deepin-daemon 组的普通用户不应能自行注册为受信调用者。 -->
    <deny send_destination="org.deepin.dde.Lastore1"
          send_interface="org.deepin.dde.Lastore1.Manager"
          send_member="SetAllowCaller"/>
  </policy>
  <policy group="lightdm">
    <allow send_destination="org.deepin.dde.Lastore1"/>
    <allow receive_sender="org.deepin.dde.Lastore1"/>
    <!-- lightdm 已通过 trustedCallerUIDs 信任，无需调用 SetAllowCaller -->
    <deny send_destination="org.deepin.dde.Lastore1"
          send_interface="org.deepin.dde.Lastore1.Manager"
          send_member="SetAllowCaller"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.deepin.dde.Lastore1"/>
    <allow receive_sender="org.deepin.dde.Lastore1"/>
  </policy>

</busconfig>
